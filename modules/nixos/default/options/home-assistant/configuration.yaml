# Loads default set of integrations. Do not remove.
default_config:

recorder:
  db_url: postgresql://hass@/hass
  purge_keep_days: 365
  exclude:
    entity_globs:
      - sensor.awtrix_*_current_app
      - sensor.awtrix_*_free_ram
      - sensor.awtrix_*_uptime
      - sensor.awtrix_*_wifi_strength
    entities:
      - sensor.gem_active_notification_count

homekit:
  advertise_ip: !env_var HOST_IP
  filter:
    include_domains:
      - cover
      - light
      - lock
      - switch

panel_custom:
  - name: ha_automation
    sidebar_title: Automation
    sidebar_icon: mdi:cog-transfer
    js_url: /api/hassio/app/entrypoint.js
    url_path: 'config/automation/dashboard'
    embed_iframe: true
    require_admin: true
    config:
      ingress: core_configurator  
  - name: ha_integ
    sidebar_title: Integrations
    sidebar_icon: mdi:checkerboard
    js_url: /api/hassio/app/entrypoint.js
    url_path: 'config/integrations'
    embed_iframe: true
    require_admin: true
    config:
      ingress: core_configurator

